[project]
name = "nl_maps"
version = "0.3.0"
authors = [
  { name="Bert de Bruijn", email="lpdebruijn@gmail.com" },
]
dependencies = [
    "Pillow>=12.1.0"
]
optional-dependencies = { test = ["pytest>=8"] }
description = "Create informative maps of the Netherlands, including the BES islands."
readme = "README.md"
license = "MIT AND CC-BY-SA-4.0 AND LicenseRef-CBS"
license-files = [
    "LICENSE",
    "nl_maps/source/LICENSE_ISLANDS_PROVINCES",
    "nl_maps/source/LICENSE_MUNICIPALITIES",
    "nl_maps/source/MODIFICATIONS.md",
]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/debruijn/nl_maps"
"Bug Tracker" = "https://github.com/debruijn/nl_maps/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"